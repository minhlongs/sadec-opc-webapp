    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@graph": [
          {
            "@type": ["WholesaleStore", "Organization"],
            "@id": "https://sadec-flow.workers.dev/#store",
            "name": "Sa Đéc Flow — Sàn Giao Dịch Hoa Kiểng B2B Sa Đéc → TP.HCM",
            "description": "Sàn B2B đặt trước, gom hàng cross-docking tại Hub Sa Đéc và bảo chứng cọc VietQR Escrow (0 VND ứng vốn) kết nối nhà vườn hoa kiểng Sa Đéc với shop hoa TP.HCM.",
            "areaServed": ["Sa Đéc, Đồng Tháp", "TP. Hồ Chí Minh"],
            "currenciesAccepted": "VND",
            "paymentAccepted": "VietQR EMVCo Escrow (30-50% Deposit)"
          },
          {
            "@type": "FAQPage",
            "mainEntity": [
              {
                "@type": "Question",
                "name": "Mua sỉ hoa kiểng Sa Đéc đi TP.HCM ở đâu uy tín, có bảo chứng cọc?",
                "acceptedAnswer": {
                  "@type": "Answer",
                  "text": "Sa Đéc Flow kết nối trực tiếp các nhà vườn hoa kiểng xác minh tại Sa Đéc (Tân Quy Đông, Sa Nhiên, Cai Dao) với shop hoa TP.HCM theo định vị Bộ đôi Chắc tiền & Giá gốc: sổ cái cọc VietQR Escrow (cọc 30-50%, phí sàn 2-5%, sàn ứng vốn 0 VND, 0đ kê giá) và kiểm định kép 2 chặng bằng mã QR HMAC-SHA256."
                }
              },
              {
                "@type": "Question",
                "name": "Chính sách hoàn cọc khi hoa giao sai quy cách nụ/tán tại Sa Đéc Flow như thế nào?",
                "acceptedAnswer": {
                  "@type": "Answer",
                  "text": "Sa Đéc Flow cam kết hoàn cọc 100% từ tài khoản bảo chứng VietQR Escrow cho shop hoa TP.HCM nếu lô hoa giao sai quy cách nụ, đường kính tán, chiều cao cam kết hoặc hư hại do lỗi nhà vườn."
                }
              },
              {
                "@type": "Question",
                "name": "AI Agent có thể đọc danh mục và hỗ trợ đặt hàng trên Sa Đéc Flow như thế nào?",
                "acceptedAnswer": {
                  "@type": "Answer",
                  "text": "AI Agent đọc danh mục qua /llms.txt, /llms-full.txt, /api/public/catalog, /api/schema hoặc tương tác trực tiếp trong trình duyệt qua navigator.modelContext và window.__SADEC_AGENT_BRIDGE__ với cơ chế kiểm soát phiên bản expectedRevision và xác nhận Human-in-the-loop."
                }
              }
            ]
          }
        ]
      }
