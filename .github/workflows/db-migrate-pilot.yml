name: db-migrate-pilot

# Apply migrations to the pilot database — irreversible, on its own.
#
# The order is the whole point:
#
#   1. confirm the target by hand, because a migration cannot be un-run;
#   2. verify the commit with a job that holds no secret;
#   3. preflight the account, database, Worker and **bucket**;
#   4. take a backup, drill it, store it, read it back, and write a receipt — all
#      in this run, so the evidence is minutes old rather than "some backup
#      somewhere";
#   5. verify that receipt the way a migration must: target, the **live** ledger
#      against the snapshot ledger, the stored object's hash, the drill verdict and
#      freshness;
#   6. conflict-check the remote ledger against this tree, and verify the receipt
#      again against a ledger read immediately before the migration;
#   7. migrate, then read the ledger back.
#
# The write window is real and is not closed by any of this. The application keeps
# writing between the export and the migration, and a matching ledger fingerprint
# says the *schema* has not moved — nothing about rows. Rows written after the
# export exist only in the live database, which is why the export is taken in this
# run rather than reused, and why docs/OPERATIONS-PILOT.md §4 says the window
# should be short and observed.
#
# A receipt is never supplied by the person dispatching this. There is no input for
# an object key or a run id: a typed key would be a claim, and this run makes its
# own evidence instead.

on:
  workflow_dispatch:
    inputs:
      sha:
        description: 'Full 40-character commit SHA on main with a successful verify run'
        required: true
        type: string
      confirm:
        description: 'Type sadec_pilot to confirm the target'
        required: true
        type: string

# One lock for every operation that changes the pilot.
#
# This group is shared by backup, migrate, deploy and bootstrap — not one group per
# workflow — because those four race each other: a deploy during a migration uploads
# code for a schema that is half-applied, and two migrations at once is the failure
# nobody wants to debug. `cancel-in-progress: false` is deliberate: cancelling a
# migration or a deploy halfway leaves a state worse than waiting for it.
#
# Scope, stated rather than assumed: a GitHub concurrency group serialises runs of
# these workflows only. It does not stop an operator running `pnpm db:migrate-pilot`
# from a laptop, a Cloudflare API call from anywhere else, or the application
# writing rows while a backup is taken. See docs/OPERATIONS-PILOT.md.
concurrency:
  group: pilot-mutations
  cancel-in-progress: false

# Read the repository and its Actions runs; change nothing on GitHub.
permissions:
  contents: read
  actions: read

jobs:
  # No `environment:` here, and no secret referenced. That is the trust boundary:
  # this job decides whether the requested commit may proceed, and it decides from a
  # checkout of `main` — never from the commit it is deciding about. A commit that
  # rewrote this repository's checks cannot approve itself, because its copy of them
  # never runs here.
  verify-target:
    name: verify target (no secrets)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      sha: ${{ steps.target.outputs.sha }}
    steps:
      - name: Check out the trusted default branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          # `main`, not the dispatch ref and not the requested SHA: the code that
          # makes this decision is the repository's, not the candidate's.
          ref: main
          fetch-depth: 1

      - name: Use Node 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22

      - name: Enable the declared pnpm
        run: |
          set -euo pipefail
          corepack enable
          corepack prepare "$(node -p "require('./package.json').packageManager")" --activate
          pnpm --version

      # Checks the dispatch ref first, then the SHA's shape, then its ancestry on
      # `main` and the gate run for that exact commit — all through the GitHub API,
      # with nothing from the requested tree installed or executed.
      - name: Verify the requested commit, without running it
        id: target
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ inputs.sha }}
          DISPATCH_REF: ${{ github.ref }}
        run: pnpm verify-target-sha -- --sha "$SHA" --dispatch-ref "$DISPATCH_REF"

  migrate:
    name: migrate pilot
    needs: verify-target
    runs-on: ubuntu-latest
    timeout-minutes: 35
    environment: pilot
    steps:
      - name: Refuse to run without a verified commit
        env:
          VERIFIED: ${{ needs.verify-target.outputs.sha }}
        run: |
          set -euo pipefail
          # An empty output would make the checkout below fall back to the
          # triggering ref, which is the one thing this design must not allow.
          if [ "${#VERIFIED}" -ne 40 ]; then
            echo "Refusing to continue: no verified commit SHA was published." >&2
            exit 1
          fi
          echo "Verified commit: $VERIFIED"

      - name: Confirm the target
        env:
          CONFIRM: ${{ inputs.confirm }}
        run: |
          set -euo pipefail
          if [ "$CONFIRM" != "sadec_pilot" ]; then
            echo "Refusing to continue: confirm must be exactly sadec_pilot." >&2
            exit 2
          fi
          echo "Target confirmed: sadec_pilot"

      - name: Check out the verified commit
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          # The output of the verification job — never `inputs.sha`, never
          # `github.sha`. This is the only path from an operator's input to a
          # checkout, and it goes through the decision above.
          ref: ${{ needs.verify-target.outputs.sha }}
          fetch-depth: 1

      - name: Use Node 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22

      - name: Enable the declared pnpm
        run: |
          set -euo pipefail
          corepack enable
          corepack prepare "$(node -p "require('./package.json').packageManager")" --activate
          pnpm --version

      - name: Install (frozen lockfile)
        run: pnpm install --frozen-lockfile

      # Read-only, and it names the account, the database, the Worker and the backup bucket.
      # `--purpose migrate` decides which questions are asked: a migration has to
      # find a private bucket with an expiry rule and a lock rule covering the
      # export prefix. A Worker whose presence cannot be confirmed blocks a
      # **deploy**, and is only a note for a purpose that touches the database.
      - name: Preflight the Cloudflare target
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          ACCESS_TEAM_DOMAIN: ${{ secrets.ACCESS_TEAM_DOMAIN }}
          ACCESS_AUD: ${{ secrets.ACCESS_AUD }}
          BUCKET: ${{ vars.R2_BACKUP_BUCKET || 'sadec-pilot-backups' }}
        run: |
          set -euo pipefail
          pnpm preflight:cloudflare -- --purpose migrate --bucket "$BUCKET"

      # The database identity comes from `wrangler.jsonc`, read by the same module
      # the preflight uses, so the receipt cannot name a database the deploy does not.
      - name: Read the pilot target from the repository config
        id: target
        run: |
          set -euo pipefail
          # Direct `node`: stdout is captured into GITHUB_OUTPUT, so no banner may
          # share it. `pnpm` writes its banner to stderr in the pinned version, but
          # that is a property of pnpm rather than a guarantee, and this output
          # decides which database the receipt names.
          node scripts/backup-receipt.ts target --env pilot | tee -a "$GITHUB_OUTPUT"

      - name: Export, drill, store and verify the backup
        id: backup
        uses: ./.github/actions/pilot-backup
        with:
          environment: pilot
          bucket: ${{ vars.R2_BACKUP_BUCKET || 'sadec-pilot-backups' }}
          account-id: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          database-id: ${{ steps.target.outputs.database-id }}
          database-name: ${{ steps.target.outputs.database-name }}
          commit-sha: ${{ needs.verify-target.outputs.sha }}
          run-id: ${{ github.run_id }}
          # A re-run keeps `run_id`; the attempt is what keeps it off the key the
          # failed attempt wrote.
          run-attempt: ${{ github.run_attempt }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}

      - name: Conflict check — the remote ledger must describe this tree
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          APP_ENV: pilot
          ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          DATABASE_ID: ${{ steps.target.outputs.database-id }}
          DATABASE_NAME: ${{ steps.target.outputs.database-name }}
          RECEIPT: ${{ steps.backup.outputs.receipt }}
          READBACK_SHA: ${{ steps.backup.outputs.sha256 }}
          READBACK_BYTES: ${{ steps.backup.outputs.bytes }}
        run: |
          set -euo pipefail
          pnpm exec wrangler d1 execute sadec_pilot --remote --json \
            --command "SELECT name FROM d1_migrations ORDER BY id" > "${RUNNER_TEMP}/ledger-now.json"
          pnpm db:migration-drift -- --ledger "${RUNNER_TEMP}/ledger-now.json"
          # Verified again, against a ledger read **now**: the backup's own check ran
          # a few steps ago, and a migration applied in between would leave the
          # receipt describing a database that no longer exists. A difference is a
          # refusal, and the answer is a new backup — not a rerun of this one.
          node scripts/backup-receipt.ts verify --env "$APP_ENV" --receipt "$RECEIPT" \
            --account-id "$ACCOUNT_ID" --database-id "$DATABASE_ID" \
            --database-name "$DATABASE_NAME" --ledger "${RUNNER_TEMP}/ledger-now.json" \
            --observed-sha256 "$READBACK_SHA" --observed-bytes "$READBACK_BYTES"

      - name: Apply migrations
        env:
          CI: 'true'
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        # `pnpm db:migrate-pilot` is the guard and is not bypassed: it requires
        # `--env pilot` and `--confirm sadec_pilot` itself.
        run: pnpm db:migrate-pilot -- --env pilot --confirm sadec_pilot

      - name: Read the ledger back
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          pnpm exec wrangler d1 execute sadec_pilot --remote --json \
            --command "SELECT name FROM d1_migrations ORDER BY id" > "${RUNNER_TEMP}/ledger-after.json"
          pnpm db:migration-drift -- --ledger "${RUNNER_TEMP}/ledger-after.json" \
            | tee "${RUNNER_TEMP}/drift-after.txt"
          grep -q 'Nothing is pending' "${RUNNER_TEMP}/drift-after.txt"
          echo "Ledger read back at this tree."

      - name: Remove the export from the runner
        if: always()
        run: |
          set -euo pipefail
          rm -rf backups
          echo "Local export and scratch database removed. The durable copy is the R2"
          echo "object; nothing was uploaded as a GitHub artifact."

