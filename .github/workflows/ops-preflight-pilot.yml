name: ops-preflight-pilot

# Account, resource and configuration preflight — read-only, and the first thing to
# run before anything else, and again when a later step fails for no visible reason.
#
# It answers: is the token pointed at this account; does `sadec-pilot` exist with the
# id the config binds; does the Worker exist (a refusal to look is not a pass); are
# the Access values present; and, when asked for, is there a private bucket with
# retention.
#
# It also says what it does **not** answer: a non-empty GitHub secret is not proof
# that the deployed Worker holds the same Access configuration, and no request here
# authenticates as a person.

on:
  workflow_dispatch:
    inputs:
      sha:
        description: 'Full 40-character commit SHA on main with a successful verify run'
        required: true
        type: string
      purpose:
        description: 'What to check for: deploy, migrate, backup, bootstrap or inspect'
        required: true
        default: inspect
        type: choice
        options:
          - inspect
          - deploy
          - backup
          - migrate
          - bootstrap

# Read-only, so it runs in the read-only group rather than behind the mutating
# lock: a preflight that has to wait for a deploy is a preflight that arrives after
# the thing it was meant to check.
concurrency:
  group: pilot-reads
  cancel-in-progress: false

# Read the repository and its Actions runs; change nothing on GitHub.
permissions:
  contents: read
  actions: read

jobs:
  # No `environment:` here, and no secret referenced. That is the trust boundary:
  # this job decides whether the requested commit may proceed, and it decides from a
  # checkout of `main` — never from the commit it is deciding about. A commit that
  # rewrote this repository's checks cannot approve itself, because its copy of them
  # never runs here.
  verify-target:
    name: verify target (no secrets)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      sha: ${{ steps.target.outputs.sha }}
    steps:
      - name: Check out the trusted default branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          # `main`, not the dispatch ref and not the requested SHA: the code that
          # makes this decision is the repository's, not the candidate's.
          ref: main
          fetch-depth: 1

      - name: Use Node 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22

      - name: Enable the declared pnpm
        run: |
          set -euo pipefail
          corepack enable
          corepack prepare "$(node -p "require('./package.json').packageManager")" --activate
          pnpm --version

      # Checks the dispatch ref first, then the SHA's shape, then its ancestry on
      # `main` and the gate run for that exact commit — all through the GitHub API,
      # with nothing from the requested tree installed or executed.
      - name: Verify the requested commit, without running it
        id: target
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ inputs.sha }}
          DISPATCH_REF: ${{ github.ref }}
        run: pnpm verify-target-sha -- --sha "$SHA" --dispatch-ref "$DISPATCH_REF"

  preflight:
    name: preflight pilot
    needs: verify-target
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: pilot
    steps:
      - name: Refuse to run without a verified commit
        env:
          VERIFIED: ${{ needs.verify-target.outputs.sha }}
        run: |
          set -euo pipefail
          # An empty output would make the checkout below fall back to the
          # triggering ref, which is the one thing this design must not allow.
          if [ "${#VERIFIED}" -ne 40 ]; then
            echo "Refusing to continue: no verified commit SHA was published." >&2
            exit 1
          fi
          echo "Verified commit: $VERIFIED"

      - name: Check out the verified commit
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          # The output of the verification job — never `inputs.sha`, never
          # `github.sha`. This is the only path from an operator's input to a
          # checkout, and it goes through the decision above.
          ref: ${{ needs.verify-target.outputs.sha }}
          fetch-depth: 1

      - name: Use Node 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22

      - name: Enable the declared pnpm
        run: |
          set -euo pipefail
          corepack enable
          corepack prepare "$(node -p "require('./package.json').packageManager")" --activate
          pnpm --version

      - name: Install (frozen lockfile)
        run: pnpm install --frozen-lockfile

      - name: Check the Cloudflare target
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          ACCESS_TEAM_DOMAIN: ${{ secrets.ACCESS_TEAM_DOMAIN }}
          ACCESS_AUD: ${{ secrets.ACCESS_AUD }}
          PURPOSE: ${{ inputs.purpose }}
          BUCKET: ${{ vars.R2_BACKUP_BUCKET || 'sadec-pilot-backups' }}
        run: |
          set -euo pipefail
          # The purpose is a fixed list in the dispatch form, so it is passed as an
          # argument rather than pasted into a command line.
          pnpm preflight:cloudflare -- --purpose "$PURPOSE" --bucket "$BUCKET"

      - name: Permissions each operation needs
        run: |
          set -euo pipefail
          echo "This check used Account:Read, D1:Read, Workers Scripts:Read, and for a"
          echo "backup or migration also R2 read of the bucket's configuration."
          echo "A deploy needs Workers Scripts:Edit; a backup needs R2 object write;"
          echo "a migration needs D1:Edit. A 403 above names the operation, not the token."

