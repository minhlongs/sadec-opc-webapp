name: ops-preflight-pilot

# Account, resource and configuration preflight — the first thing to run, and the
# first thing to re-run when something later fails for no visible reason.
#
# It answers four questions and changes nothing:
#
#   1. does the token work, and is it pointed at the account this repository's
#      database ids belong to?
#   2. does a database named `sadec-pilot` exist, with the id `wrangler.jsonc`
#      binds to `sadec_pilot`?
#   3. does the Worker `sadec-flow-pilot` exist (absent is reported, not failed:
#      a first deploy has no Worker yet)?
#   4. are `ACCESS_TEAM_DOMAIN` and `ACCESS_AUD` present and non-empty?
#
# Read-only throughout, and it prints no token and no response body. Run it before
# a first deploy, and again whenever a deploy fails in a way that does not look
# like a code problem.

on:
  workflow_dispatch:
    inputs:
      sha:
        description: 'Full 40-character commit SHA on main with a successful verify run'
        required: true
        type: string

concurrency:
  group: preflight-pilot
  cancel-in-progress: false

permissions:
  contents: read
  actions: read

jobs:
  preflight:
    name: preflight pilot
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: pilot
    steps:
      - name: Check out the exact commit
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ inputs.sha }}
          fetch-depth: 0

      - name: Use Node 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22

      - name: Enable the declared pnpm
        run: |
          set -euo pipefail
          corepack enable
          corepack prepare "$(node -p "require('./package.json').packageManager")" --activate
          pnpm --version

      - name: Refuse a commit that CI has not passed on main
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ inputs.sha }}
        run: pnpm require-main-sha -- --sha "$SHA"

      # The preflight script uses `fetch` and `node:fs` only, so it runs before an
      # install: a wrong target should cost seconds, not a dependency download.
      - name: Check the Cloudflare target
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          ACCESS_TEAM_DOMAIN: ${{ secrets.ACCESS_TEAM_DOMAIN }}
          ACCESS_AUD: ${{ secrets.ACCESS_AUD }}
        run: pnpm preflight:cloudflare

      - name: Permissions the other workflows need
        run: |
          set -euo pipefail
          echo "This check used Account:Read, D1:Read and Workers Scripts:Read."
          echo "A deploy needs Workers Scripts:Edit; a migration or backup needs D1:Edit."
          echo "A 403 above names the operation, not the token — add the scope and re-run."
