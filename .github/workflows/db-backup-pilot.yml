name: db-backup-pilot

# Take a pilot backup, then prove it can be read back — in one job, on one runner.
#
# A backup nobody has restored is a file, not a backup. §14 asks for the restore to
# be exercised rather than described, so this workflow does both and fails if the
# replay does not produce the same rows.
#
# Three deliberate limits:
#
#   * **The export never leaves the runner through an artifact.** A D1 export of
#     the pilot holds real business records, and GitHub artifacts on a private
#     repository are readable by anyone with read access — there is no per-artifact
#     ACL to restrict or expire one. Keeping the file inside the job's ephemeral
#     workspace is the only restriction available. If an archive is needed, the
#     operator runs `pnpm db:backup -- --env pilot` from a machine they control and
#     stores it where pilot data belongs. See docs/DEPLOY-VIA-GITHUB.md.
#   * **The drill is given an explicit `--file`.** `scripts/db-restore-drill.ts`
#     refuses to guess, and the workflow passes the one file this job just wrote,
#     after asserting the workspace holds exactly one.
#   * **The drill replays into a throwaway local SQLite file**, never onto the
#     pilot database and never onto `sadec_test`. Restoring over the source would
#     destroy the evidence it is meant to produce — and is forbidden outright.
#
# Read-only against Cloudflare: `wrangler d1 export` only reads.

on:
  workflow_dispatch:
    inputs:
      sha:
        description: 'Full 40-character commit SHA on main with a successful verify run'
        required: true
        type: string

concurrency:
  group: db-pilot
  cancel-in-progress: false

permissions:
  contents: read
  actions: read

jobs:
  backup-and-drill:
    name: backup pilot, then prove it replays
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment: pilot
    steps:
      - name: Check out the exact commit
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ inputs.sha }}
          fetch-depth: 0

      - name: Use Node 22
        uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4f3fdee5af
        with:
          node-version: 22

      - name: Enable the declared pnpm
        run: |
          set -euo pipefail
          corepack enable
          corepack prepare "$(node -p "require('./package.json').packageManager")" --activate
          pnpm --version

      - name: Refuse a commit that CI has not passed on main
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ inputs.sha }}
        run: pnpm require-main-sha -- --sha "$SHA"

      - name: Install (frozen lockfile)
        run: pnpm install --frozen-lockfile

      - name: Take the backup
        id: backup
        env:
          CI: 'true'
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          pnpm db:backup -- --env pilot
          # The workspace is fresh, so exactly one export can exist. Asserting the
          # count is what makes "the file this run wrote" a fact rather than an
          # assumption — the same reason the drill has no newest-file default.
          count="$(find backups -maxdepth 1 -type f -name 'sadec_pilot-*.sql' | wc -l | tr -d ' ')"
          if [ "$count" != "1" ]; then
            echo "Refusing to continue: expected exactly one export, found ${count}." >&2
            exit 1
          fi
          file="$(find backups -maxdepth 1 -type f -name 'sadec_pilot-*.sql' | head -n 1)"
          bytes="$(wc -c < "$file" | tr -d ' ')"
          if [ "$bytes" -lt 1024 ]; then
            echo "Refusing to continue: the export is ${bytes} bytes, which is not a database." >&2
            exit 1
          fi
          echo "Exported ${bytes} bytes."
          echo "file=${file}" >> "$GITHUB_OUTPUT"

      - name: Prove the export replays
        env:
          BACKUP: ${{ steps.backup.outputs.file }}
        run: |
          set -euo pipefail
          if [ -z "$BACKUP" ]; then
            echo "Refusing to continue: no backup path was handed to the drill." >&2
            exit 1
          fi
          pnpm db:restore:drill -- --env pilot --file "$BACKUP"

      # The pilot data does not outlive the job. On success there is nothing left
      # to keep; on failure the log above is the evidence, and the export is one
      # more copy of real records sitting on someone else's disk.
      - name: Remove the export from the runner
        if: always()
        run: |
          set -euo pipefail
          rm -rf backups
          echo "Export removed. It was never uploaded: see the note at the top of this file."
