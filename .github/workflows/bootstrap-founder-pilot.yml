name: bootstrap-founder-pilot

# The one-time grant of the first `founder_admin`, run by hand, once.
#
# Separate from every deploy on purpose: a bootstrap that reruns on each deployment
# is a login rule with extra steps, and granting on "first login" is forbidden
# outright. This job also cannot grant to a subject the dispatcher did not type, and
# it cannot write at all unless `subject_verified` is exactly `yes`.
#
# The inputs are the awkward part and are documented rather than smoothed over: the
# subject and the email are **metadata**. They appear in the run log, in the audit
# row and in the Actions UI. No token, JWT or credential may ever be put in an input
# of this form — if one is, it is in the UI permanently.

on:
  workflow_dispatch:
    inputs:
      sha:
        description: 'Full 40-character commit SHA on main with a successful verify run'
        required: true
        type: string
      confirm:
        description: 'Type sadec_pilot to confirm the target'
        required: true
        type: string
      subject_verified:
        description: 'Type yes only if you read the subject from the Access identity, not copied from the email'
        required: true
        type: string
      access_sub:
        description: 'The `sub` claim from a verified Access identity (metadata; visible in run logs and the UI)'
        required: true
        type: string
      email:
        description: 'The founder email (metadata; visible in run logs and the UI)'
        required: true
        type: string
      workspace_id:
        description: 'Workspace id to create or use, e.g. ws-pilot'
        required: true
        type: string
      workspace_name:
        description: 'Workspace name as it will be stored'
        required: true
        type: string
      reason:
        description: 'Why this grant is being made (recorded in the audit row)'
        required: true
        type: string
      operator:
        description: 'Who is running this (a declaration, recorded in the audit row)'
        required: true
        type: string
      ticket:
        description: 'Change or ticket reference (recorded in the audit row)'
        required: true
        type: string

# One lock for every operation that changes the pilot.
#
# This group is shared by backup, migrate, deploy and bootstrap — not one group per
# workflow — because those four race each other: a deploy during a migration uploads
# code for a schema that is half-applied, and two migrations at once is the failure
# nobody wants to debug. `cancel-in-progress: false` is deliberate: cancelling a
# migration or a deploy halfway leaves a state worse than waiting for it.
#
# Scope, stated rather than assumed: a GitHub concurrency group serialises runs of
# these workflows only. It does not stop an operator running `pnpm db:migrate-pilot`
# from a laptop, a Cloudflare API call from anywhere else, or the application
# writing rows while a backup is taken. See docs/OPERATIONS-PILOT.md.
concurrency:
  group: pilot-mutations
  cancel-in-progress: false

# Read the repository and its Actions runs; change nothing on GitHub.
permissions:
  contents: read
  actions: read

jobs:
  # No `environment:` here, and no secret referenced. That is the trust boundary:
  # this job decides whether the requested commit may proceed, and it decides from a
  # checkout of `main` — never from the commit it is deciding about. A commit that
  # rewrote this repository's checks cannot approve itself, because its copy of them
  # never runs here.
  verify-target:
    name: verify target (no secrets)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      sha: ${{ steps.target.outputs.sha }}
    steps:
      - name: Check out the trusted default branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          # `main`, not the dispatch ref and not the requested SHA: the code that
          # makes this decision is the repository's, not the candidate's.
          ref: main
          fetch-depth: 1

      - name: Use Node 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22

      - name: Enable the declared pnpm
        run: |
          set -euo pipefail
          corepack enable
          corepack prepare "$(node -p "require('./package.json').packageManager")" --activate
          pnpm --version

      # Checks the dispatch ref first, then the SHA's shape, then its ancestry on
      # `main` and the gate run for that exact commit — all through the GitHub API,
      # with nothing from the requested tree installed or executed.
      - name: Verify the requested commit, without running it
        id: target
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ inputs.sha }}
          DISPATCH_REF: ${{ github.ref }}
        run: pnpm verify-target-sha -- --sha "$SHA" --dispatch-ref "$DISPATCH_REF"

  bootstrap:
    name: bootstrap founder
    needs: verify-target
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: pilot
    steps:
      - name: Refuse to run without a verified commit
        env:
          VERIFIED: ${{ needs.verify-target.outputs.sha }}
        run: |
          set -euo pipefail
          # An empty output would make the checkout below fall back to the
          # triggering ref, which is the one thing this design must not allow.
          if [ "${#VERIFIED}" -ne 40 ]; then
            echo "Refusing to continue: no verified commit SHA was published." >&2
            exit 1
          fi
          echo "Verified commit: $VERIFIED"

      - name: Confirm the target
        env:
          CONFIRM: ${{ inputs.confirm }}
        run: |
          set -euo pipefail
          if [ "$CONFIRM" != "sadec_pilot" ]; then
            echo "Refusing to continue: confirm must be exactly sadec_pilot." >&2
            exit 2
          fi
          echo "Target confirmed: sadec_pilot"

      - name: Check out the verified commit
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          # The output of the verification job — never `inputs.sha`, never
          # `github.sha`. This is the only path from an operator's input to a
          # checkout, and it goes through the decision above.
          ref: ${{ needs.verify-target.outputs.sha }}
          fetch-depth: 1

      - name: Use Node 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22

      - name: Enable the declared pnpm
        run: |
          set -euo pipefail
          corepack enable
          corepack prepare "$(node -p "require('./package.json').packageManager")" --activate
          pnpm --version

      - name: Install (frozen lockfile)
        run: pnpm install --frozen-lockfile

      # Read-only, and it names the account, the database, the Worker.
      # `--purpose bootstrap` decides which questions are asked: a Worker whose
      # presence cannot be confirmed blocks every purpose that writes, and a
      # backup or migration also has to find a private bucket with retention.
      - name: Preflight the Cloudflare target
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          ACCESS_TEAM_DOMAIN: ${{ secrets.ACCESS_TEAM_DOMAIN }}
          ACCESS_AUD: ${{ secrets.ACCESS_AUD }}
          BUCKET: ${{ vars.R2_BACKUP_BUCKET || 'sadec-pilot-backups' }}
        run: |
          set -euo pipefail
          pnpm preflight:cloudflare -- --purpose bootstrap

      # Preview first, always. It reads and prints what it would do without writing,
      # and it is the review point: the values below are the values the apply step
      # uses, so the preview is evidence about this run rather than about another.
      - name: Preview (writes nothing)
        env:
          CI: 'true'
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          ACCESS_SUB: ${{ inputs.access_sub }}
          EMAIL: ${{ inputs.email }}
          WORKSPACE_ID: ${{ inputs.workspace_id }}
          WORKSPACE_NAME: ${{ inputs.workspace_name }}
          REASON: ${{ inputs.reason }}
          OPERATOR: ${{ inputs.operator }}
          TICKET: ${{ inputs.ticket }}
        run: |
          set -euo pipefail
          pnpm bootstrap:founder -- --env pilot \
            --workspace-id "$WORKSPACE_ID" --workspace-name "$WORKSPACE_NAME" \
            --access-sub "$ACCESS_SUB" --email "$EMAIL" --reason "$REASON" \
            --operator "$OPERATOR" --ticket "$TICKET"

      - name: Apply the grant
        if: inputs.subject_verified == 'yes'
        env:
          CI: 'true'
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          ACCESS_SUB: ${{ inputs.access_sub }}
          EMAIL: ${{ inputs.email }}
          WORKSPACE_ID: ${{ inputs.workspace_id }}
          WORKSPACE_NAME: ${{ inputs.workspace_name }}
          REASON: ${{ inputs.reason }}
          OPERATOR: ${{ inputs.operator }}
          TICKET: ${{ inputs.ticket }}
        run: |
          set -euo pipefail
          # The script still requires `--subject-verified`; this job cannot pass it
          # without the dispatcher having declared it above.
          pnpm bootstrap:founder -- --env pilot \
            --workspace-id "$WORKSPACE_ID" --workspace-name "$WORKSPACE_NAME" \
            --access-sub "$ACCESS_SUB" --email "$EMAIL" --reason "$REASON" \
            --operator "$OPERATOR" --ticket "$TICKET" --apply --subject-verified

      - name: Refuse when the subject was not declared verified
        if: inputs.subject_verified != 'yes'
        env:
          DECLARED: ${{ inputs.subject_verified }}
        run: |
          set -euo pipefail
          echo "Only the preview ran. subject_verified was \"${DECLARED}\", not \"yes\"." >&2
          echo "Read the sub claim from the identity Access verified, then re-run with" >&2
          echo "subject_verified: yes. Nothing was written." >&2
          exit 1

      - name: What this job cannot verify
        if: always()
        run: |
          set -euo pipefail
          echo "The attestation above is a declaration, not a proof: nothing here can"
          echo "show that the subject was read from a real identity. The subject and the"
          echo "email are metadata and appear in the run log and the audit row."
          echo "A real login after the grant is still a human gate."

