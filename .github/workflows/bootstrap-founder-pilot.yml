name: bootstrap-founder-pilot

# The one-time grant of the first `founder_admin`, run by hand, once.
#
# Run this *after* a deploy and a green smoke, and only with a subject read from a
# verified Access identity. It is a separate workflow precisely so it cannot be
# part of every deploy: a bootstrap that reruns on each deployment is a login rule
# with extra steps, and §6 forbids "first person to log in" and any endpoint that
# grants access.
#
# What this workflow does not do:
#
#   * it does not guess or derive the subject. `--access-sub` is an input, and the
#     email is a separate input on purpose;
#   * it does not pass `--subject-verified` unless the operator typed `yes` into a
#     dispatch field, in which case they declared they read `sub` from the identity.
#     Without that declaration the job runs the preview only and fails. The script
#     guard is kept, not bypassed;
#   * it does not grant to the first login, to the demo identity, or to anyone the
#     operator has not checked. A wrong subject creates an identity nobody can sign
#     in as, and a second bootstrap is then refused.

on:
  workflow_dispatch:
    inputs:
      sha:
        description: 'Full 40-character commit SHA on main with a successful verify run'
        required: true
        type: string
      confirm:
        description: 'Type sadec_pilot to confirm the target'
        required: true
        type: string
      subject_verified:
        description: 'Type yes only if you read the subject from the Access identity, not from the email'
        required: true
        type: string
      access_sub:
        description: 'The `sub` claim from a verified Access identity'
        required: true
        type: string
      email:
        description: 'The founder email'
        required: true
        type: string
      workspace_id:
        description: 'Workspace id to create or use, e.g. ws-pilot'
        required: true
        type: string
      workspace_name:
        description: 'Workspace name as it will be stored'
        required: true
        type: string
      reason:
        description: 'Why this grant is being made (recorded in the audit row)'
        required: true
        type: string
      operator:
        description: 'Who is running this (a declaration, recorded in the audit row)'
        required: true
        type: string
      ticket:
        description: 'Change or ticket reference (recorded in the audit row)'
        required: true
        type: string

concurrency:
  group: db-pilot
  cancel-in-progress: false

permissions:
  contents: read
  actions: read

jobs:
  bootstrap:
    name: bootstrap founder
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: pilot
    steps:
      - name: Confirm the target
        env:
          CONFIRM: ${{ inputs.confirm }}
        run: |
          set -euo pipefail
          if [ "$CONFIRM" != "sadec_pilot" ]; then
            echo "Refusing to continue: confirm must be exactly sadec_pilot." >&2
            exit 2
          fi
          echo "Target confirmed: sadec_pilot"

      - name: Check out the exact commit
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ inputs.sha }}
          fetch-depth: 0

      - name: Use Node 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22

      - name: Enable the declared pnpm
        run: |
          set -euo pipefail
          corepack enable
          corepack prepare "$(node -p "require('./package.json').packageManager")" --activate
          pnpm --version

      - name: Refuse a commit that CI has not passed on main
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ inputs.sha }}
        run: pnpm require-main-sha -- --sha "$SHA"

      - name: Install (frozen lockfile)
        run: pnpm install --frozen-lockfile

      - name: Preflight the Cloudflare target
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          ACCESS_TEAM_DOMAIN: ${{ secrets.ACCESS_TEAM_DOMAIN }}
          ACCESS_AUD: ${{ secrets.ACCESS_AUD }}
        run: pnpm preflight:cloudflare

      # Preview first, always: it reads the database and prints what it would do
      # without writing. The values are the same ones the apply step uses, so the
      # preview is evidence about this run rather than about a different input.
      - name: Preview (writes nothing)
        env:
          CI: 'true'
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          ACCESS_SUB: ${{ inputs.access_sub }}
          EMAIL: ${{ inputs.email }}
          WORKSPACE_ID: ${{ inputs.workspace_id }}
          WORKSPACE_NAME: ${{ inputs.workspace_name }}
          REASON: ${{ inputs.reason }}
          OPERATOR: ${{ inputs.operator }}
          TICKET: ${{ inputs.ticket }}
        run: |
          set -euo pipefail
          pnpm bootstrap:founder -- --env pilot \
            --workspace-id "$WORKSPACE_ID" --workspace-name "$WORKSPACE_NAME" \
            --access-sub "$ACCESS_SUB" --email "$EMAIL" --reason "$REASON" \
            --operator "$OPERATOR" --ticket "$TICKET"

      - name: Apply the grant
        if: inputs.subject_verified == 'yes'
        env:
          CI: 'true'
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          ACCESS_SUB: ${{ inputs.access_sub }}
          EMAIL: ${{ inputs.email }}
          WORKSPACE_ID: ${{ inputs.workspace_id }}
          WORKSPACE_NAME: ${{ inputs.workspace_name }}
          REASON: ${{ inputs.reason }}
          OPERATOR: ${{ inputs.operator }}
          TICKET: ${{ inputs.ticket }}
        run: |
          set -euo pipefail
          pnpm bootstrap:founder -- --env pilot \
            --workspace-id "$WORKSPACE_ID" --workspace-name "$WORKSPACE_NAME" \
            --access-sub "$ACCESS_SUB" --email "$EMAIL" --reason "$REASON" \
            --operator "$OPERATOR" --ticket "$TICKET" --apply --subject-verified

      - name: Refuse when the subject was not declared verified
        if: inputs.subject_verified != 'yes'
        env:
          DECLARED: ${{ inputs.subject_verified }}
        run: |
          set -euo pipefail
          echo "Only the preview ran. subject_verified was \"${DECLARED}\", not \"yes\"." >&2
          echo "Read the \`sub\` claim from the identity Access verified, then re-run" >&2
          echo "with subject_verified: yes. Nothing was written." >&2
          exit 1
