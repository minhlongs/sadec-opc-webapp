name: smoke-pilot

# Readiness and fail-closed evidence for the pilot, from a runner that is not the
# operator's laptop.
#
# Read-only, and it holds **no secret at all**: it declares the `pilot` environment
# only so the same approval rule covers the evidence. It is deliberately not part of
# the deploy, so "the smoke test failed" never invites a redeploy as the answer.
#
# A green run says the catalogue and discovery pages reached the database and the
# refusals behaved. It does not say a person can sign in, and it does not say a save
# survives a reload — those are human gates in docs/PILOT-GATES.md.

on:
  workflow_dispatch:
    inputs:
      sha:
        description: 'Full 40-character commit SHA on main with a successful verify run'
        required: true
        type: string
      base_url:
        description: 'The pilot URL to check, e.g. https://sadec-flow-pilot.<account>.workers.dev'
        required: true
        type: string

# Read-only, so it has its own group rather than the mutating lock: two smoke runs
# against the same host do not conflict, and making them queue behind a migration
# would only delay the evidence. It still refuses to cancel a run in progress,
# because half a smoke report is not a report.
concurrency:
  group: pilot-reads
  cancel-in-progress: false

# Read the repository and its Actions runs; change nothing on GitHub.
permissions:
  contents: read
  actions: read

jobs:
  # No `environment:` here, and no secret referenced. That is the trust boundary:
  # this job decides whether the requested commit may proceed, and it decides from a
  # checkout of `main` — never from the commit it is deciding about. A commit that
  # rewrote this repository's checks cannot approve itself, because its copy of them
  # never runs here.
  verify-target:
    name: verify target (no secrets)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      sha: ${{ steps.target.outputs.sha }}
    steps:
      - name: Check out the trusted default branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          # `main`, not the dispatch ref and not the requested SHA: the code that
          # makes this decision is the repository's, not the candidate's.
          ref: main
          fetch-depth: 1

      - name: Use Node 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22

      - name: Enable the declared pnpm
        run: |
          set -euo pipefail
          corepack enable
          corepack prepare "$(node -p "require('./package.json').packageManager")" --activate
          pnpm --version

      # Checks the dispatch ref first, then the SHA's shape, then its ancestry on
      # `main` and the gate run for that exact commit — all through the GitHub API,
      # with nothing from the requested tree installed or executed.
      - name: Verify the requested commit, without running it
        id: target
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ inputs.sha }}
          DISPATCH_REF: ${{ github.ref }}
        run: pnpm verify-target-sha -- --sha "$SHA" --dispatch-ref "$DISPATCH_REF"

  smoke:
    name: smoke pilot
    needs: verify-target
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: pilot
    steps:
      - name: Refuse to run without a verified commit
        env:
          VERIFIED: ${{ needs.verify-target.outputs.sha }}
        run: |
          set -euo pipefail
          # An empty output would make the checkout below fall back to the
          # triggering ref, which is the one thing this design must not allow.
          if [ "${#VERIFIED}" -ne 40 ]; then
            echo "Refusing to continue: no verified commit SHA was published." >&2
            exit 1
          fi
          echo "Verified commit: $VERIFIED"

      - name: Check out the verified commit
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          # The output of the verification job — never `inputs.sha`, never
          # `github.sha`. This is the only path from an operator's input to a
          # checkout, and it goes through the decision above.
          ref: ${{ needs.verify-target.outputs.sha }}
          fetch-depth: 1

      - name: Use Node 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22

      - name: Enable the declared pnpm
        run: |
          set -euo pipefail
          corepack enable
          corepack prepare "$(node -p "require('./package.json').packageManager")" --activate
          pnpm --version

      - name: Install (frozen lockfile)
        run: pnpm install --frozen-lockfile

      # No install: `smoke:live` imports nothing outside `node:`, and a smoke test
      # that needs the dependency tree is one that fails for unrelated reasons.
      - name: Readiness and fail-closed checks
        env:
          BASE_URL: ${{ inputs.base_url }}
        run: pnpm smoke:live -- --base-url "$BASE_URL" --expect-env pilot

      - name: What this result means
        if: always()
        run: |
          set -euo pipefail
          echo "PASS on readiness means the catalogue and discovery pages reached the database."
          echo "A 503 reported separately as correct handling still FAILS readiness."
          echo "A human login and a save/reload remain unproven by this job."

